{% extends "base_client.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:60px auto;">
  <h2>{% if selected_role == 'checkout' %}結帳端登入{% else %}後台管理登入{% endif %}</h2>

  {% if error %}
  <p style="color:#b00020;font-weight:bold;">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="role" value="{{ selected_role or 'admin' }}">

    <label>密碼</label>
    <input type="password" name="password"
           style="width:100%;padding:10px;margin:8px 0 14px;"
           autocomplete="current-password" required autofocus>

    <button class="btn" type="submit">登入</button>
  </form>

  {% if selected_role == 'checkout' %}
  <p style="margin-top:16px;"><a class="btn gray" href="/admin">← 返回後台主頁</a></p>
  {% endif %}
</div>
{% endblock %}
